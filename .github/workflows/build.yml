name: Build installable APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GlassLauncher.apk
          gh release create "build-${{ github.run_number }}" GlassLauncher.apk --target "${{ github.sha }}" --title "Glass Launcher build ${{ github.run_number }}" --prerelease --notes "First Android launcher prototype. Debug-signed APK for testing. Includes app search, favorites, glass-style panels and a bedside clock. Not yet tested on a physical tablet."
